name: Publish to npm
on:
  push:
    branches:
      - main
permissions:
  contents: write
  id-token: write
  pull-requests: write

env:
  UPSTREAM_REPOS: "cli"
  PACKAGE_NAMES: "easyeda"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Use bun
        uses: oven-sh/setup-bun@v1
      - run: npm install -g pver
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: pver release

      - name: Trigger upstream repo updates
        if: env.UPSTREAM_REPOS && env.PACKAGE_NAMES
        env:
          GH_TOKEN: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
        run: |
          IFS=',' read -ra REPOS <<< "$UPSTREAM_REPOS"
          for repo in "${REPOS[@]}"; do
            if [[ -n "$repo" ]]; then
              echo "Triggering update for repo: $repo"
              curl --fail-with-body -X POST \
                -H "Accept: application/vnd.github.v3+json" \
                -H "Authorization: token $GH_TOKEN" \
                -H "Content-Type: application/json" \
                "https://api.github.com/repos/tscircuit/$repo/actions/workflows/update-package.yml/dispatches" \
                -d "{\"ref\":\"main\",\"inputs\":{\"package_names\":\"$PACKAGE_NAMES\"}}"
            fi
          done
