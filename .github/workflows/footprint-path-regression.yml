name: Footprint path regression

on:
  pull_request:
    paths:
      - 'lib/utils/expand-easyeda-path-data.ts'
      - 'tests/c37616412-*.test.ts'
      - 'tests/assets/C37616412.raweasy.json'
      - '.github/workflows/footprint-path-regression.yml'
  workflow_dispatch:

jobs:
  footprint-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Converter, native PCB, and existing arc regressions
        run: >-
          bun test
          tests/c37616412-fabrication-outline.test.ts
          tests/c37616412-repeated-path-arguments.test.ts
          tests/c5815189-npth-cutout-repro.test.ts
          tests/arc-utils.test.ts
          tests/arc-utils-semicircle.test.ts
          tests/svg-arc-sweep.test.ts
      - run: bunx tsc --noEmit
      - run: bun run format:check
      - run: bun run build
